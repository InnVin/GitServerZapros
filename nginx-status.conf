# GitServerZapros: страница состояния выкладки на IP — http://<IP>/status и /status.json.
# Кладётся в /etc/nginx/projects.d/gsz-status.conf (подключает сайт по IP — FamilyTree). Ставит install.sh, пишет status.mjs.
location = /status {
    alias /var/lib/gsz/www/status.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
}
location = /status.json {
    alias /var/lib/gsz/www/status.json;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-cache";
}
